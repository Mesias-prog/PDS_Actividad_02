<text x="39" y="620" class="note">Transformaciones del adaptador:</text>
<text x="39" y="637" class="note">1. cédula → employeeNo (directorio)</text>
<text x="39" y="654" class="note">2. fecha → [inicio, fin) en segundos epoch</text>
<text x="39" y="671" class="note">3. List&lt;PunchRecord&gt; → RegistroAsistencia:</text>
<text x="39" y="688" class="note">    ingreso = primer CHECK_IN</text>
<text x="39" y="705" class="note">    salida  = último CHECK_OUT</text>
<text x="39" y="722" class="note">4. epoch → LocalTime (zona America/Guayaquil)</text>
